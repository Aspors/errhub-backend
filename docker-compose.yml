services:
  postgres:
    image: postgres:16-alpine
    container_name: errhub-db
    environment:
      POSTGRES_USER: errhub_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: errhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: errhub-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
